name: Jolt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  jolt:
    name: Jolt tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Jolt
        run: curl -sL https://raw.githubusercontent.com/jolt-lang/jolt/main/install | bash
      - name: Run Jolt tests
        run: >-
          ~/.local/bin/jolt -A:jolt
          -Sdeps '{:paths ["src" "test"]}'
          -M -m clojev.jolt-test
